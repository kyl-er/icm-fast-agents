[package]
name = "swarm-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "swarm"
path = "src/main.rs"

[dependencies]
rig-agent-demo = { path = "../03-harness/rig" }
swarms-rs = "0.3.0"
async-openai = { version = "0.30.1", features = ["byot"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
futures = "0.3"
anyhow = "1"

[profile.release]
opt-level = 2
debug = false
