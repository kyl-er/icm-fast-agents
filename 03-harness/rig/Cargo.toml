[package]
name = "rig-agent-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = { version = "0.46.0", features = ["reqwest"] }
rig-agent = "0.46.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
futures = "0.3"
rig-reqwest = "0.46.0"
bytes = "1.12.1"

[profile.release]
opt-level = 2
debug = false

[[bin]]
name = "rig-agent"
path = "src/main.rs"
