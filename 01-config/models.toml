# Reusable provider + model registry for icm-agent-demo.
# Source: "Fast Models" sheet (claude.ai/artifact/MtLUmEsMRFZxxiF4rdbabG, revision 15) plus the demo roster.
# Every provider is OpenAI-compatible: POST {base_url}/chat/completions with "Authorization: Bearer $key_env".
# Keys live in ~/.config/icm-agent-demo/keys.env. Prices are USD per 1M tokens (in, out) as listed on 2026-11-15.
# Check ids against the live APIs with: python3 harness/registry.py verify

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_env  = "OPENROUTER_API_KEY"
console  = "https://openrouter.ai/settings/keys"
docs     = "https://openrouter.ai/docs"

[providers.cerebras]
base_url = "https://api.cerebras.ai/v1"
key_env  = "CEREBRAS_API_KEY"
console  = "https://cloud.cerebras.ai/"
docs     = "https://inference-docs.cerebras.ai/"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
key_env  = "GROQ_API_KEY"
console  = "https://console.groq.com/"
docs     = "https://console.groq.com/docs"
max_tokens = 900          # free tier caps output tokens per minute

[providers.celeris]
base_url = "https://inference.celeris.ai/{model}/v1"   # the model id is part of the URL
key_env  = "CELERIS_API_KEY"
console  = "https://console.celeris.ai/"
docs     = "https://docs.celeris.ai/"

[providers.inception]
base_url = "https://api.inceptionlabs.ai/v1"
key_env  = "INCEPTION_API_KEY"
console  = "https://platform.inceptionlabs.ai/"
docs     = "https://docs.inceptionlabs.ai/"
ends     = "2026-12-28"   # Mercury API shuts down

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env  = "GEMINI_API_KEY"
console  = "https://aistudio.google.com/apikey"
docs     = "https://ai.google.dev/gemini-api/docs/openai"

[providers.vercel]
base_url = "https://ai-gateway.vercel.sh/v1"
key_env  = "AI_GATEWAY_API_KEY"   # in the shell environment, not in keys.env
console  = "https://vercel.com/dashboard"
docs     = "https://vercel.com/docs/ai-gateway"

[providers.morph]
base_url = "https://api.morphllm.com/v1"
key_env  = "MORPH_API_KEY"         # no key yet
console  = "https://www.morphllm.com/dashboard"
docs     = "https://docs.morphllm.com/"

